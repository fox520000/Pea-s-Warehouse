<!DOCTYPE html>
<html lang="zh" class="light" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>转换进度 - Pea 全能格式转换器</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <style type="text/tailwindcss">
    @theme inline {
      --color-background: var(--doubao-background);
      --color-foreground: var(--doubao-foreground);
      --color-card: var(--doubao-card);
      --color-card-foreground: var(--doubao-card-foreground);
      --color-popover: var(--doubao-popover);
      --color-popover-foreground: var(--doubao-popover-foreground);
      --color-primary: var(--doubao-primary);
      --color-primary-foreground: var(--doubao-primary-foreground);
      --color-secondary: var(--doubao-secondary);
      --color-secondary-foreground: var(--doubao-secondary-foreground);
      --color-muted: var(--doubao-muted);
      --color-muted-foreground: var(--doubao-muted-foreground);
      --color-accent: var(--doubao-accent);
      --color-accent-foreground: var(--doubao-accent-foreground);
      --color-destructive: var(--doubao-destructive);
      --color-destructive-foreground: var(--doubao-destructive-foreground);
      --color-border: var(--doubao-border);
      --color-input: var(--doubao-input);
      --color-ring: var(--doubao-ring);
      --color-chart-1: var(--doubao-chart-1);
      --color-chart-2: var(--doubao-chart-2);
      --color-chart-3: var(--doubao-chart-3);
      --color-chart-4: var(--doubao-chart-4);
      --color-chart-5: var(--doubao-chart-5);
      --radius-sm: var(--doubao-radius-sm);
      --radius-md: var(--doubao-radius-md);
      --radius-lg: var(--doubao-radius-lg);
      --radius-xl: var(--doubao-radius-xl);
    }
    @layer base {
      body { background: var(--doubao-background); color: var(--doubao-foreground); }
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased">
  <main class="flex min-h-screen flex-col">
    <!-- Header -->
    <header class="sticky top-0 z-10 border-b border-border bg-background/95 backdrop-blur">
      <div class="mx-auto flex max-w-5xl items-center justify-between px-4 sm:px-6 py-4">
        <a href="index.html" class="flex items-center gap-2 text-lg font-semibold text-foreground">
          <span data-icon class="inline-flex text-primary" style="width:20px;height:20px;mask-image:url(assets/image_0_tgt36j.svg);-webkit-mask-image:url(assets/image_0_tgt36j.svg);"></span>
          <span class="hide-sm sm:inline">Pea 全能格式转换器</span>
          <span class="sm:hidden inline">Pea</span>
        </a>
        <nav class="flex items-center gap-1 bg-muted rounded-lg p-1">
          <a href="index.html" data-dom-id="nav-home" class="inline-flex items-center gap-2 rounded-md px-3 py-1.5 text-sm font-medium text-muted-foreground hover:text-foreground transition-colors hide-sm sm:inline-flex">
            <span data-icon class="inline-flex" style="width:16px;height:16px;mask-image:url(assets/image_7_tgt36j.svg);-webkit-mask-image:url(assets/image_7_tgt36j.svg);"></span>
            首页
          </a>
          <a href="settings.html" data-dom-id="nav-settings" class="inline-flex items-center gap-2 rounded-md px-3 py-1.5 text-sm font-medium text-muted-foreground hover:text-foreground transition-colors hide-sm sm:inline-flex">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            设置
          </a>
          <a href="progress.html" aria-current="page" class="inline-flex items-center gap-2 rounded-md bg-primary px-3 py-1.5 text-sm font-medium text-primary-foreground">
            <span data-icon class="inline-flex" style="width:16px;height:16px;mask-image:url(assets/image_8_tgt36j.svg);-webkit-mask-image:url(assets/image_8_tgt36j.svg);"></span>
            <span class="hide-sm sm:inline">转换进度</span>
            <span class="sm:hidden inline">进度</span>
          </a>
          <a href="result.html" data-dom-id="nav-result" class="inline-flex items-center gap-2 rounded-md px-3 py-1.5 text-sm font-medium text-muted-foreground hover:text-foreground transition-colors">
            <span data-icon class="inline-flex" style="width:16px;height:16px;mask-image:url(assets/image_9_tgt36j.svg);-webkit-mask-image:url(assets/image_9_tgt36j.svg);"></span>
            <span class="hide-sm sm:inline">转换结果</span>
            <span class="sm:hidden inline">结果</span>
          </a>
        </nav>
      </div>
    </header>

    <section class="mx-auto w-full max-w-5xl flex-1 px-4 sm:px-6 py-6 sm:py-8">
      <!-- 总体进度面板 -->
      <div class="panel mb-5 sm:mb-6 fade-in">
        <div class="head">
          <h2>总体进度</h2>
          <span data-overall-count class="sub">· 0 个文件</span>
          <span class="spacer"></span>
          <button data-dom-id="action-pause" class="btn outline sm">
            <span data-icon class="inline-flex" style="width:14px;height:14px;mask-image:url(assets/image_6_tgt36j.svg);-webkit-mask-image:url(assets/image_6_tgt36j.svg);"></span>
            <span class="hide-sm sm:inline">暂停全部</span>
            <span class="sm:hidden inline">暂停</span>
          </button>
          <button data-dom-id="action-retry-failed" class="btn outline sm">
            <span data-icon class="inline-flex" style="width:14px;height:14px;mask-image:url(assets/image_8_tgt36j.svg);-webkit-mask-image:url(assets/image_8_tgt36j.svg);"></span>
            <span class="hide-sm sm:inline">重试失败项</span>
            <span class="sm:hidden inline">重试</span>
          </button>
        </div>
        <div class="p-4 sm:p-5">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2 text-sm">
              <span class="inline-flex items-center gap-2">
                <span class="relative inline-flex h-2 w-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-chart-1 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-chart-1"></span>
                </span>
                <span class="text-muted-foreground">正在转换中...</span>
              </span>
            </div>
            <div class="text-right">
              <span data-overall-pct class="text-2xl font-semibold tabular-nums text-foreground">0%</span>
            </div>
          </div>
          <div class="w-full h-3 sm:h-4 bg-muted rounded-full overflow-hidden">
            <div data-overall-progress class="h-full rounded-full bg-gradient-to-r from-chart-1 to-primary progress-bar-fill transition-all duration-500" style="width:0%;"></div>
          </div>
          <div class="grid grid-cols-3 gap-2 sm:gap-4 mt-5 pt-4 border-t border-border text-sm">
            <div class="text-center">
              <div class="flex items-center justify-center gap-1.5 mb-1">
                <span data-icon class="inline-flex text-chart-2" style="width:16px;height:16px;mask-image:url(assets/image_10_tgt36j.svg);-webkit-mask-image:url(assets/image_10_tgt36j.svg);"></span>
                <span id="prog-ok" class="text-card-foreground font-semibold">0</span>
              </div>
              <p class="text-xs text-muted-foreground">已完成</p>
            </div>
            <div class="text-center">
              <div class="flex items-center justify-center gap-1.5 mb-1">
                <span data-icon class="inline-flex text-chart-1" style="width:16px;height:16px;mask-image:url(assets/image_8_tgt36j.svg);-webkit-mask-image:url(assets/image_8_tgt36j.svg);"></span>
                <span id="prog-run" class="text-card-foreground font-semibold">0</span>
              </div>
              <p class="text-xs text-muted-foreground">进行中</p>
            </div>
            <div class="text-center">
              <div class="flex items-center justify-center gap-1.5 mb-1">
                <span data-icon class="inline-flex text-destructive" style="width:16px;height:16px;mask-image:url(assets/image_11_tgt36j.svg);-webkit-mask-image:url(assets/image_11_tgt36j.svg);"></span>
                <span id="prog-err" class="text-card-foreground font-semibold">0</span>
              </div>
              <p class="text-xs text-muted-foreground">失败</p>
            </div>
          </div>
        </div>
      </div>

      <!-- 各个文件进度 -->
      <div class="panel fade-in" style="animation-delay:.05s">
        <div class="head">
          <h2>任务详情</h2>
          <span class="spacer"></span>
          <span class="text-xs text-muted-foreground hide-sm sm:inline">预计剩余时间约 <span id="eta-time">计算中</span></span>
        </div>
        <div data-progress-list class="divide-y divide-border"></div>
      </div>

      <!-- 底部操作 -->
      <div class="flex flex-col sm:flex-row items-center justify-between gap-3 mt-6">
        <a href="settings.html" class="btn ghost w-full sm:w-auto">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          返回设置
        </a>
        <a href="result.html" id="go-result" class="btn primary w-full sm:w-auto opacity-60 pointer-events-none transition-all">
          <span data-icon class="h-4 w-4" style="mask-image:url(assets/image_9_tgt36j.svg);-webkit-mask-image:url(assets/image_9_tgt36j.svg);"></span>
          查看转换结果
        </a>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    // 补充: 更新状态统计 & 完成解锁
    const _origRenderProgress = window.renderProgress;
    document.addEventListener('DOMContentLoaded', () => {
      const orig = renderProgress;
      window.renderProgress = function () {
        orig();
        const state = JSON.parse(localStorage.getItem('pea_converter_state') || '{"files":[]}');
        const ok = state.files.filter(f => f.status === 'ok').length;
        const run = state.files.filter(f => f.status === 'run').length;
        const err = state.files.filter(f => f.status === 'err').length;
        document.getElementById('prog-ok').textContent = ok;
        document.getElementById('prog-run').textContent = run;
        document.getElementById('prog-err').textContent = err;
        const eta = document.getElementById('eta-time');
        if (eta) {
          const remaining = state.files.length - ok - err;
          if (remaining <= 0) eta.textContent = '已完成';
          else eta.textContent = `${remaining * 5} 秒`;
        }
        const goResult = document.getElementById('go-result');
        if (goResult && state.files.every(f => f.status === 'ok' || f.status === 'err')) {
          goResult.classList.remove('opacity-60', 'pointer-events-none');
          goResult.classList.add('hover:shadow-lg', 'hover:shadow-primary/20');
        }
      };
      // 立即刷新统计
      setTimeout(renderProgress, 50);
    });
  </script>
</body>
</html>

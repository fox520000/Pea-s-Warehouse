<!DOCTYPE html>
<html lang="zh" class="light" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>转换设置 - Pea 全能格式转换器</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <style type="text/tailwindcss">
    @theme inline {
      --color-background: var(--doubao-background);
      --color-foreground: var(--doubao-foreground);
      --color-card: var(--doubao-card);
      --color-card-foreground: var(--doubao-card-foreground);
      --color-popover: var(--doubao-popover);
      --color-popover-foreground: var(--doubao-popover-foreground);
      --color-primary: var(--doubao-primary);
      --color-primary-foreground: var(--doubao-primary-foreground);
      --color-secondary: var(--doubao-secondary);
      --color-secondary-foreground: var(--doubao-secondary-foreground);
      --color-muted: var(--doubao-muted);
      --color-muted-foreground: var(--doubao-muted-foreground);
      --color-accent: var(--doubao-accent);
      --color-accent-foreground: var(--doubao-accent-foreground);
      --color-destructive: var(--doubao-destructive);
      --color-destructive-foreground: var(--doubao-destructive-foreground);
      --color-border: var(--doubao-border);
      --color-input: var(--doubao-input);
      --color-ring: var(--doubao-ring);
      --color-chart-1: var(--doubao-chart-1);
      --color-chart-2: var(--doubao-chart-2);
      --color-chart-3: var(--doubao-chart-3);
      --color-chart-4: var(--doubao-chart-4);
      --color-chart-5: var(--doubao-chart-5);
      --radius-sm: var(--doubao-radius-sm);
      --radius-md: var(--doubao-radius-md);
      --radius-lg: var(--doubao-radius-lg);
      --radius-xl: var(--doubao-radius-xl);
    }
    @layer base {
      body { background: var(--doubao-background); color: var(--doubao-foreground); }
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased">
  <main class="flex min-h-screen flex-col">
    <!-- Header -->
    <header class="sticky top-0 z-50 border-b border-border bg-background/95 backdrop-blur">
      <div class="mx-auto flex h-14 max-w-7xl items-center justify-between px-4 lg:px-6">
        <a href="index.html" data-dom-id="nav-home" class="flex items-center gap-2 text-base font-semibold text-foreground">
          <span data-icon class="h-5 w-5 text-primary" style="-webkit-mask-image:url(assets/image_0_tgt36j.svg);mask-image:url(assets/image_0_tgt36j.svg);"></span>
          <span class="hide-sm sm:inline">Pea 全能格式转换器</span>
          <span class="sm:hidden inline">Pea</span>
        </a>
        <nav class="flex items-center gap-1">
          <a href="index.html" class="inline-flex h-9 items-center rounded-full px-3 text-sm font-medium text-muted-foreground hover:bg-muted hover:text-foreground transition-colors">首页</a>
          <a href="settings.html" class="inline-flex h-9 items-center rounded-full bg-primary px-3 text-sm font-medium text-primary-foreground" aria-current="page">设置</a>
          <a href="progress.html" class="inline-flex h-9 items-center rounded-full px-3 text-sm font-medium text-muted-foreground hover:bg-muted hover:text-foreground transition-colors hide-sm sm:inline-flex">进度</a>
          <a href="result.html" class="inline-flex h-9 items-center rounded-full px-3 text-sm font-medium text-muted-foreground hover:bg-muted hover:text-foreground transition-colors hide-sm sm:inline-flex">结果</a>
          <button data-theme-toggle class="inline-flex h-9 w-9 items-center justify-center rounded-full text-muted-foreground hover:bg-muted hover:text-foreground transition-colors ml-1" aria-label="切换主题">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          </button>
        </nav>
      </div>
    </header>

    <!-- 主内容 -->
    <div class="mx-auto w-full max-w-7xl flex-1 px-4 py-5 sm:py-6 lg:px-6">
      <div class="grid grid-cols-1 gap-5 sm:gap-6 lg:grid-cols-[minmax(0,1fr)_minmax(0,420px)]">
        
        <!-- 左侧：待转换文件 -->
        <section class="flex flex-col gap-4 rounded-xl border border-border bg-card shadow-sm overflow-hidden fade-in">
          <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between p-4 border-b border-border">
            <div class="flex items-center gap-2">
              <h1 class="text-lg font-semibold text-card-foreground">待转换文件</h1>
              <span data-files-count class="rounded-full bg-muted px-2 py-0.5 text-xs font-medium text-muted-foreground">0</span>
            </div>
            <div class="flex items-center gap-2">
              <button data-dom-id="action-add-files" class="inline-flex h-9 items-center gap-1.5 rounded-full border border-border bg-background px-3 text-sm font-medium text-foreground transition-colors hover:bg-muted">
                <span data-icon class="h-4 w-4" style="-webkit-mask-image:url(assets/image_4_tgt36j.svg);mask-image:url(assets/image_4_tgt36j.svg);"></span>
                <span>添加文件</span>
              </button>
              <button data-dom-id="action-clear-list" class="inline-flex h-9 items-center gap-1.5 rounded-full border border-border bg-background px-3 text-sm font-medium text-destructive transition-colors hover:bg-destructive/10">
                <span data-icon class="h-4 w-4" style="-webkit-mask-image:url(assets/image_5_tgt36j.svg);mask-image:url(assets/image_5_tgt36j.svg);"></span>
                <span class="hide-sm sm:inline">清空列表</span>
                <span class="sm:hidden inline">清空</span>
              </button>
            </div>
          </div>
          <div data-file-list class="divide-y divide-border"></div>
        </section>

        <!-- 右侧：输出设置 -->
        <aside class="flex flex-col gap-5 lg:sticky lg:top-20 fade-in" style="animation-delay:.08s">
          <!-- 目标格式 -->
          <div class="rounded-xl border border-border bg-card shadow-sm p-4 sm:p-5">
            <h2 class="text-base font-semibold text-card-foreground mb-4 flex items-center gap-2">
              <span data-icon class="h-4 w-4 text-primary" style="-webkit-mask-image:url(assets/image_9_tgt36j.svg);mask-image:url(assets/image_9_tgt36j.svg);"></span>
              统一目标格式
            </h2>
            <p class="text-xs text-muted-foreground mb-3">快速为所有文件选择目标格式</p>
            <div data-target-grid class="grid grid-cols-4 gap-2 sm:gap-3"></div>
          </div>

          <!-- 高级设置 -->
          <div class="rounded-xl border border-border bg-card shadow-sm p-4 sm:p-5">
            <h2 class="text-base font-semibold text-card-foreground mb-4 flex items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              高级设置
            </h2>

            <div class="space-y-4">
              <!-- 转换质量 -->
              <div>
                <label class="block text-sm font-medium text-foreground mb-2">转换质量</label>
                <div class="grid grid-cols-3 gap-2">
                  <label class="cursor-pointer">
                    <input type="radio" name="quality" data-setting="quality" value="low" class="peer sr-only">
                    <div class="text-center py-2 rounded-lg border border-border bg-background text-sm text-muted-foreground peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:text-primary transition-all">
                      压缩优先
                    </div>
                  </label>
                  <label class="cursor-pointer">
                    <input type="radio" name="quality" data-setting="quality" value="medium" class="peer sr-only">
                    <div class="text-center py-2 rounded-lg border border-border bg-background text-sm text-muted-foreground peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:text-primary transition-all">
                      均衡
                    </div>
                  </label>
                  <label class="cursor-pointer">
                    <input type="radio" name="quality" data-setting="quality" value="high" class="peer sr-only" checked>
                    <div class="text-center py-2 rounded-lg border border-border bg-background text-sm text-muted-foreground peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:text-primary transition-all">
                      质量优先
                    </div>
                  </label>
                </div>
              </div>

              <!-- 分隔线 -->
              <div class="h-px bg-border"></div>

              <!-- 开关选项 -->
              <div class="space-y-3">
                <label class="flex items-center justify-between cursor-pointer group">
                  <span class="text-sm text-foreground">转换后自动打开文件</span>
                  <input type="checkbox" data-setting="autoOpen" class="peer sr-only">
                  <span class="relative inline-flex h-6 w-11 shrink-0 items-center rounded-full bg-muted transition-colors peer-checked:bg-primary group-hover:bg-muted/80">
                    <span class="inline-block h-5 w-5 transform rounded-full bg-background shadow-sm transition-transform translate-x-0.5 peer-checked:translate-x-5"></span>
                  </span>
                </label>
                <label class="flex items-center justify-between cursor-pointer group">
                  <span class="text-sm text-foreground">保留原文件元数据</span>
                  <input type="checkbox" data-setting="preserveMeta" class="peer sr-only" checked>
                  <span class="relative inline-flex h-6 w-11 shrink-0 items-center rounded-full bg-muted transition-colors peer-checked:bg-primary group-hover:bg-muted/80">
                    <span class="inline-block h-5 w-5 transform rounded-full bg-background shadow-sm transition-transform translate-x-0.5 peer-checked:translate-x-5"></span>
                  </span>
                </label>
                <label class="flex items-center justify-between cursor-pointer group">
                  <div>
                    <span class="text-sm text-foreground">转换完成通知</span>
                    <p class="text-xs text-muted-foreground mt-0.5">全部任务完成后桌面提醒</p>
                  </div>
                  <input type="checkbox" data-setting="notify" class="peer sr-only">
                  <span class="relative inline-flex h-6 w-11 shrink-0 items-center rounded-full bg-muted transition-colors peer-checked:bg-primary group-hover:bg-muted/80">
                    <span class="inline-block h-5 w-5 transform rounded-full bg-background shadow-sm transition-transform translate-x-0.5 peer-checked:translate-x-5"></span>
                  </span>
                </label>
              </div>
            </div>
          </div>

          <!-- 操作按钮 -->
          <div class="flex flex-col sm:flex-row lg:flex-col gap-3">
            <button data-dom-id="action-back" class="btn ghost flex-1">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
              返回
            </button>
            <button data-dom-id="action-start-convert" class="btn primary lg flex-1 transition-all hover:shadow-lg hover:shadow-primary/20">
              <span data-icon class="h-4 w-4" style="-webkit-mask-image:url(assets/image_8_tgt36j.svg);mask-image:url(assets/image_8_tgt36j.svg);"></span>
              开始转换
            </button>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
